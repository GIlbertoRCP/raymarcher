name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  native-tests:
    name: Native physics tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure (CPU tests only, no CUDA toolkit)
        run: cmake -S native -B native/build -DRAYMARCHER_BUILD_VIEWER=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build native/build --config Release
      - name: Test
        run: ctest --test-dir native/build -C Release --output-on-failure
